<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Repwerk Fitness</title>
<meta name="description" content="Essen fotografieren, Makros tracken und mit einem Plan trainieren, der zu dir passt.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repwerk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, scrolling content, fixed tab bar; sheets slide up from the bottom. */
:root {
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#EFEDE8; --line:#E4E2DD;
  --ink:#1C1714; --ink-muted:#6A615A; --ember:#FF5B2E; --on-ember:#1C1714; --ember-ink:#B8400F; --ember-soft:#FFE6DC;
  --protein:#1597B5; --carbs:#B98A12; --fat:#C2457A; --good:#1F9D5C; --warning:#C27803; --critical:#D33240;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif; --font-sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px; color-scheme:light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#111214; --surface:#1A1C20; --surface-2:#23262B; --line:#2E3238; --ink:#F4F0EA; --ink-muted:#ADA49B; --ember-ink:#FF8A63; --ember-soft:#3B2018;
  --protein:#38BDD8; --carbs:#E9C46A; --fat:#E5679A; --good:#3DBE7A; --warning:#F59E0B; --critical:#EF4E5A; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#111214; --surface:#1A1C20; --surface-2:#23262B; --line:#2E3238; --ink:#F4F0EA; --ink-muted:#ADA49B; --ember-ink:#FF8A63; --ember-soft:#3B2018;
  --protein:#38BDD8; --carbs:#E9C46A; --fat:#E5679A; --good:#3DBE7A; --warning:#F59E0B; --critical:#EF4E5A; color-scheme:dark; }

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); font-size:15px; line-height:22px; -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--ember); outline-offset:2px; }
#app { max-width:480px; margin:0 auto; min-height:100%; position:relative; }
.screen { padding:calc(16px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; }
.disp { font-family:var(--font-display); font-stretch:112%; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums; text-wrap:balance; }
.num { font-variant-numeric:tabular-nums; }
.muted { color:var(--ink-muted); }
.cap { font-size:12px; line-height:16px; font-weight:500; color:var(--ink-muted); }
.lbl { font-size:13px; line-height:18px; font-weight:600; }
.row { display:flex; align-items:center; gap:12px; }
.grow { flex:1; min-width:0; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; }
.card.soft { background:var(--ember-soft); border-color:transparent; }
h1, h2, h3 { margin:0; }
h1.disp { font-size:28px; line-height:32px; }
h2.disp { font-size:22px; line-height:28px; }
.head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
.btn { height:48px; padding:0 20px; border-radius:var(--r-md); border:1px solid transparent; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
.btn-p { background:var(--ember); color:var(--on-ember); }
.btn-s { background:var(--surface-2); border-color:var(--line); }
.btn-g { background:transparent; color:var(--ember-ink); padding:0 8px; height:40px; }
.btn-d { background:transparent; border-color:var(--line); color:var(--critical); }
.btn-sm { height:38px; padding:0 14px; font-size:14px; }
.btn-block { width:100%; }
.btn:disabled { opacity:.5; cursor:default; }
.iconbtn { width:42px; height:42px; border-radius:50%; border:0; background:var(--surface-2); display:grid; place-items:center; color:var(--ink); flex:none; }
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chips.scroll { flex-wrap:nowrap; overflow-x:auto; margin:0 -16px; padding:0 16px; scrollbar-width:none; }
.chip { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 14px; font-size:14px; font-weight:600; white-space:nowrap; }
.chip.on { background:var(--ember-soft); border-color:var(--ember); color:var(--ember-ink); }
.tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--surface-2); white-space:nowrap; }
.tag.ember { background:var(--ember-soft); color:var(--ember-ink); }
.tag .dot { width:8px; height:8px; border-radius:50%; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; }
.input { width:100%; height:48px; padding:0 14px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface-2); font-size:17px; }
textarea.input { height:auto; min-height:96px; padding:12px 14px; line-height:24px; resize:vertical; }
.field { display:flex; flex-direction:column; gap:6px; }
.unit { position:relative; }
.unit .input { padding-right:56px; font-variant-numeric:tabular-nums; }
.unit span { position:absolute; right:14px; top:13px; color:var(--ink-muted); pointer-events:none; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.list { list-style:none; margin:0; padding:0; }
.list > li { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.list > li:last-child { border-bottom:0; }
.macro { display:grid; grid-template-columns:1fr auto; gap:5px 8px; align-items:baseline; white-space:nowrap; }
.track { grid-column:1/-1; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.fill { height:100%; border-radius:999px; transition:width .25s; }
.p-bg { background:var(--protein); } .c-bg { background:var(--carbs); } .f-bg { background:var(--fat); }
.ring-t { stroke:var(--surface-2); } .ring-f { stroke:var(--ember); transition:stroke-dasharray .25s; }
.thumb { width:52px; height:52px; border-radius:var(--r-md); background:var(--surface-2); display:grid; place-items:center; flex:none; color:var(--ink); }
.thumb.ember { background:var(--ember); color:var(--on-ember); }
.empty { text-align:center; padding:20px 8px; color:var(--ink-muted); }
.banner { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--r-md); background:var(--surface-2); font-size:14px; line-height:20px; }

/* Tab bar */
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding:8px 8px calc(10px + env(safe-area-inset-bottom)); }
.tabbar nav { max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); align-items:end; }
.tab { border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:600; color:var(--ink-muted); padding:4px 0; }
.tab.on { color:var(--ink); } .tab.on svg { color:var(--ember); } .tab svg { padding:3px 14px; border-radius:999px; box-sizing:content-box; } .tab.on svg { background:var(--ember-soft); }
.plus { width:58px; height:58px; border-radius:50%; border:0; background:var(--ember); color:var(--on-ember); display:grid; place-items:center; margin:-30px auto 0; box-shadow:0 0 0 6px var(--bg); }

/* Sheets and dialogs */
.scrim { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; animation:fade .15s; }
.sheet { width:100%; max-width:480px; max-height:92%; overflow:auto; background:var(--bg); border-radius:24px 24px 0 0; padding:10px 16px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; animation:up .2s ease-out; }
.sheet > * { flex-shrink:0; }
.sheet .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 4px; flex:none; }
.dialog { margin:auto 16px; max-width:380px; background:var(--surface); border-radius:var(--r-lg); padding:20px; display:flex; flex-direction:column; gap:14px; }
.scrim.center { align-items:center; }
@keyframes up { from { transform:translateY(40px); opacity:.4; } }
@keyframes fade { from { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation:none; } .fill, .ring-f { transition:none; } }
.toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; max-width:90%; text-align:center; }

/* Workout */
.set { display:grid; grid-template-columns:26px 1fr 1fr 44px 40px; gap:8px; align-items:center; padding:5px 6px; border-radius:var(--r-sm); }
.set.head { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted); padding-top:0; padding-bottom:0; }
.set.done { background:color-mix(in srgb, var(--good) 16%, transparent); }
.set input { height:40px; text-align:center; font-weight:700; font-size:16px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface-2); width:100%; font-variant-numeric:tabular-nums; }
.check { width:40px; height:40px; border-radius:var(--r-sm); border:1.5px solid var(--line); background:transparent; display:grid; place-items:center; color:transparent; }
.check.on { background:var(--good); border-color:var(--good); color:#fff; }
.timer { white-space:nowrap; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:25; display:flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg); border-radius:999px; padding:8px 8px 8px 16px; font-weight:700; }
.timer button { border:0; border-radius:999px; height:34px; padding:0 12px; background:var(--ember); color:var(--on-ember); font-weight:700; }
.steps { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; }
.bars { display:flex; align-items:flex-end; gap:8px; height:110px; }
.bars div { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.bars i { display:block; width:100%; border-radius:6px 6px 2px 2px; background:var(--ember); min-height:3px; }
.bars span { font-size:11px; color:var(--ink-muted); }
.photo { width:100%; max-height:240px; object-fit:cover; border-radius:var(--r-md); display:block; background:var(--surface-2); }
.spinner { width:22px; height:22px; border-radius:50%; border:3px solid var(--surface-2); border-top-color:var(--ember); animation:spin .8s linear infinite; flex:none; }
@keyframes spin { to { transform:rotate(360deg); } }
.hidden { display:none !important; }
a.btn { text-decoration:none; color:var(--ink); }

/* v2 additions */
.ad { border:1px dashed var(--line); background:var(--surface); border-radius:var(--r-md); padding:10px 12px; display:flex; align-items:center; gap:12px; min-height:62px; }
.ad .adl { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); border:1px solid var(--line); border-radius:4px; padding:1px 5px; align-self:flex-start; }
.fig .spot{fill:var(--surface-2)} .fig .shadow{fill:#000;opacity:.3} [data-theme="light"] .fig .shadow{opacity:.12}
.fig .floor{stroke:var(--line);stroke-width:2} .fig line{stroke-linecap:round}
.fig .body,.fig .bodyf,.fig .headf{fill:var(--ink)} .fig .backf{fill:color-mix(in srgb,var(--ink) 55%,var(--surface-2))}
.fig .shade{fill:color-mix(in srgb,var(--ink) 82%,var(--surface-2))} .fig .line{fill:none;stroke:color-mix(in srgb,var(--ink) 70%,var(--surface-2));stroke-width:1.4;stroke-linecap:round}
.fig .glowf{fill:var(--ember)} .fig .edge>*{fill:var(--surface-2);stroke:var(--surface-2);stroke-width:3.2} .fig .back-glow{fill:color-mix(in srgb,var(--ember) 60%,var(--surface-2))}
.fig .pad{fill:color-mix(in srgb,var(--ink) 22%,var(--surface))} .fig .frame{fill:color-mix(in srgb,var(--ink) 38%,var(--surface))}
.fig .plate{fill:var(--surface-2);stroke:var(--ink-muted);stroke-width:2} .fig .plate2{fill:none;stroke:color-mix(in srgb,var(--ink) 38%,var(--surface));stroke-width:2}
.fig .hub{fill:var(--ink-muted)} .fig .padl{stroke:color-mix(in srgb,var(--ink) 22%,var(--surface))} .fig .framel{stroke:color-mix(in srgb,var(--ink) 38%,var(--surface))} .fig .gripc{fill:var(--surface-2);stroke:var(--ink-muted);stroke-width:2} .fig .plate2f{fill:color-mix(in srgb,var(--ink) 22%,var(--surface))} .fig .cab{stroke:var(--ink-muted);stroke-width:1.5}
.demo { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:8px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.demo .stage { width:240px; height:240px; }
.thumb .fig { display:block; }
.hset { display:grid; grid-template-columns:34px 1.25fr 1fr 1fr 40px; gap:6px; align-items:center; padding:4px 4px; border-radius:var(--r-sm); }
.hset.head { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted); padding-top:0; padding-bottom:0; }
.hset.done { background:color-mix(in srgb, var(--good) 16%, transparent); }
.hset input { height:38px; text-align:center; font-weight:700; font-size:16px; border-radius:var(--r-sm); border:1px solid transparent; background:var(--surface-2); width:100%; font-variant-numeric:tabular-nums; min-width:0; }
.hset.done input { background:transparent; }
.hset .prev { font-size:13px; color:var(--ink-muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.stype { height:34px; border:0; border-radius:var(--r-sm); background:transparent; font-weight:800; font-variant-numeric:tabular-nums; }
.stype.w { color:var(--warning); } .stype.d { color:#8B6CFF; } .stype.f { color:var(--critical); }
.rset { display:grid; grid-template-columns:34px 1fr 1fr 34px; gap:8px; align-items:center; }
.rset input { height:38px; text-align:center; font-weight:700; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface-2); width:100%; min-width:0; }
.exname { color:var(--ember-ink); font-weight:700; font-size:16px; border:0; background:transparent; padding:0; text-align:left; }
.pill { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:999px; border:0; background:var(--surface-2); font-size:13px; font-weight:600; color:var(--ember-ink); }
.note { width:100%; border:0; background:transparent; color:var(--ink-muted); font-size:14px; padding:4px 0; }
.note:focus { outline:none; color:var(--ink); }
.stats3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stats3 div { display:flex; flex-direction:column; }
.menu { position:absolute; right:0; top:44px; z-index:30; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:0 10px 30px rgba(0,0,0,.25); min-width:200px; padding:6px; display:flex; flex-direction:column; }
.menu button { border:0; background:transparent; text-align:left; padding:10px 12px; border-radius:var(--r-sm); font-weight:600; }
.menu button:hover { background:var(--surface-2); }
.menu .danger { color:var(--critical); }
.swatches { display:flex; gap:12px; flex-wrap:wrap; }
.sw { width:44px; height:44px; border-radius:50%; border:3px solid transparent; outline:2px solid var(--line); outline-offset:-2px; }
.sw.on { border-color:var(--bg); outline:3px solid var(--ink); outline-offset:0; }
.toggle { position:relative; width:52px; height:32px; border-radius:999px; border:0; background:var(--surface-2); flex:none; outline:1px solid var(--line); }
.toggle::after { content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:var(--ink-muted); transition:transform .15s; }
.toggle.on { background:var(--ember); outline-color:var(--ember); }
.toggle.on::after { transform:translateX(20px); background:var(--on-ember); }
.seg { display:flex; background:var(--surface-2); border-radius:var(--r-md); padding:3px; gap:3px; }
.seg button { flex:1; border:0; background:transparent; height:38px; border-radius:calc(var(--r-md) - 3px); font-weight:600; font-size:14px; color:var(--ink-muted); }
.seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.sel { position:relative; display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.sel:last-child { border-bottom:0; }
.pick { width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:none; display:grid; place-items:center; color:transparent; }
.pick.on { background:var(--ember); border-color:var(--ember); color:var(--on-ember); }
.water-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--r-md); background:color-mix(in srgb, var(--protein) 14%, transparent); }
.section-title { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.calday { aspect-ratio:1; border:0; border-radius:var(--r-sm); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink); padding:0; }
.calday:disabled { background:transparent; color:var(--ink-muted); opacity:.5; }
.calday.today { outline:2px solid var(--ink); outline-offset:-2px; }
.calday.tr { background:var(--ember-soft); }
.calday .dots { display:flex; gap:3px; height:6px; font-style:normal; }
.calday .dots b { width:6px; height:6px; border-radius:50%; }
.d-tr { background:var(--ember); } .d-good { background:var(--good); } .d-off { background:var(--warning); }
.legend { width:10px; height:10px; border-radius:50%; display:inline-block; }
.rank { width:28px; height:28px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; font-weight:800; font-size:13px; flex:none; }
.rank.top { background:var(--ember-soft); color:var(--ember-ink); }
.tabbar { display:flex; flex-direction:column; }
.activebar { display:flex; align-items:center; gap:12px; width:calc(100% - 4px); max-width:470px; align-self:center; margin:0 0 8px; padding:10px 12px; border:1px solid var(--ember); border-radius:var(--r-md); background:var(--surface); color:var(--ink); text-align:left; }
.dotlive { width:10px; height:10px; border-radius:50%; background:var(--good); flex:none; box-shadow:0 0 0 4px color-mix(in srgb, var(--good) 25%, transparent); animation:live 1.6s infinite; }
.dotlive.paused { background:var(--warning); box-shadow:0 0 0 4px color-mix(in srgb, var(--warning) 25%, transparent); animation:none; }
body.has-active .screen { padding-bottom:calc(180px + env(safe-area-inset-bottom)); }
@keyframes live { 50% { opacity:.4; } }
@media (prefers-reduced-motion: reduce) { .dotlive { animation:none; } }
.nut .nrow { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
.nut .nrow.sub { padding-left:14px; color:var(--ink-muted); font-size:14px; }
.split { display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--surface-2); }
.split i { display:block; height:100%; }
.sec { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
.sec h2.disp { font-size:20px; line-height:26px; }
.infob { border:0; background:transparent; color:var(--ink-muted); width:28px; height:28px; display:inline-grid; place-items:center; border-radius:50%; padding:0; flex:none; vertical-align:middle; }
.infob:hover { color:var(--ink); background:var(--surface-2); }
.hero { display:flex; flex-direction:column; gap:12px; padding:18px; }
.herofoot { border-top:1px solid var(--line); padding-top:10px; gap:2px; }
.mrow .track { height:8px; margin-top:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
.mrow .fill { height:100%; border-radius:99px; }
.startcard { border:1.5px solid var(--ember); display:flex; flex-direction:column; gap:10px; }
.steplist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.steplist li { display:flex; align-items:center; gap:12px; padding:8px 0; }
.steplist li.ok b { color:var(--ink-muted); text-decoration:line-through; }
.stepn { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; flex:none; font-weight:800; background:var(--surface-2); }
.steplist li.ok .stepn { background:var(--good); color:#fff; }
.daylist { list-style:none; margin:0; padding:4px 16px; }
.dayrow { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.dayrow:last-child { border-bottom:0; }

}

/* ---------- Account and cloud sync (Supabase) ----------

/* ---------- Sync: whole state as one JSON document, newest wins ---------- */

  try {
    await sbFetch('/rest/v1/user_state?on_conflict=user_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: AUTH.user.id, data: S, updated_at: new Date(S.at || Date.now()).toISOString() }) });

/* first: true right after logging in on this device */
async function cloudSync(first) {
  if (!loggedIn() || cloud.busy) return;
  if (first) setTimeout(handleInviteParam, 1200);
  cloud.state = 'syncing'; paintCloud();
  let remote; try { remote = await cloudPull(); } catch (e) { cloud.state = e.code === 'auth' && !AUTH ? 'out' : 'error'; paintCloud(); return; }
  const meta = lsGet(SYNC_KEY), known = meta && meta.uid === AUTH.user.id, localHas = !!(S && S.profile), remoteHas = !!(remote && remote.profile);
  if (!remoteHas && !localHas) { cloud.state = 'ok'; markSynced(); paintCloud(); return; }
  if (remoteHas && !localHas) { adoptRemote(remote); cloud.state = 'ok'; if (first) toast(L('Angemeldet. Deine Daten sind geladen.', 'Signed in. Your data is loaded.')); return; }
  if (!remoteHas && localHas) { await cloudPush(); if (first) toast(L('Angemeldet. Deine Daten sind jetzt gesichert.', 'Signed in. Your data is now backed up.')); return; }
  if (!known) { cloud.state = 'idle'; paintCloud(); conflictSheet(remote); return; }
  if ((remote.at || 0) > (S.at || 0)) { adoptRemote(remote); cloud.state = 'ok'; paintCloud(); }
  else if ((S.at || 0) > (remote.at || 0)) await cloudPush();
  else { cloud.state = 'ok'; markSynced(); paintCloud(); }
}

/* ---------- Community backend ----------
   CB is the community store. Inside Claude it wraps window.claude's db (claudeCB); in the web app it talks to
   Supabase tables public.profiles and public.posts (supaCB). The community views in app.js only use CB. */
let CB = null;
function claudeCB(db, me) {
  return {
    kind: 'claude',
    setProfile: p => db.doc(`profiles/${me}`).set(p),
    profiles: async () => { const q = await db.collection('profiles').limit(200).get(); return Object.fromEntries(q.docs.map(d => [d.id, d.data()])); },
    profilesByIds: async ids => { const all = await CB.profiles(); return Object.fromEntries(ids.filter(id => all[id]).map(id => [id, all[id]])); },
    setPost: post => db.doc(`posts/${me}/list/${post.id}`).set(post),
    updatePost: (id, f) => db.doc(`posts/${me}/list/${id}`).update(f),
    deletePost: id => db.doc(`posts/${me}/list/${id}`).delete(),
    listPosts: async (ids, limit) => (await Promise.all(ids.map(id => db.collection(`posts/${id}/list`).orderBy('at', 'desc').limit(limit).get().then(q => q.docs.map(d => d.data())).catch(() => [])))).flat().sort((a, b) => b.at - a.at).slice(0, limit * 4),
    getPost: async (author, id) => { const s = await db.doc(`posts/${author}/list/${id}`).get(); return s.exists ? s.data() : null; },
    deleteAll: async () => { const q = await db.collection(`posts/${me}/list`).get(); await Promise.all(q.docs.map(x => db.doc(`posts/${me}/list/${x.id}`).delete())); await db.doc(`profiles/${me}`).delete(); }
  };
}
const PROF_COLS = 'id,name,bio,avatar,goal,at';
const profMap = rows => Object.fromEntries((rows || []).map(r => [r.id, { name: r.name, bio: r.bio, avatar: r.avatar, goal: r.goal, at: r.at }]));
const uuidOk = id => /^[0-9a-f-]{36}$/i.test(id);
function supaCB() {
  const me = () => AUTH.user.id, J = b => JSON.stringify(b);
  return {
    kind: 'supabase',
    setProfile: p => sbFetch('/rest/v1/profiles?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: J({ id: me(), name: p.name || '', bio: p.bio || '', avatar: p.avatar || '', goal: p.goal || '', at: p.at || Date.now() }) }),
    profiles: async q => profMap(await sbFetch(`/rest/v1/profiles?select=${PROF_COLS}&order=at.desc&limit=100${q ? '&name=ilike.' + encodeURIComponent('*' + q.replace(/[*,()]/g, '') + '*') : ''}`, { method: 'GET' })),
    profilesByIds: async ids => { ids = ids.filter(uuidOk); return ids.length ? profMap(await sbFetch(`/rest/v1/profiles?select=${PROF_COLS}&id=in.(${ids.join(',')})`, { method: 'GET' })) : {}; },
    setPost: post => sbFetch('/rest/v1/posts?on_conflict=author,id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: J({ author: me(), id: post.id, at: post.at, data: Object.assign({}, post, { author: me() }) }) }),
    updatePost: async (id, f) => { const p = await CB.getPost(me(), id); if (p) await CB.setPost(Object.assign(p, f)); },
    deletePost: id => sbFetch(`/rest/v1/posts?author=eq.${me()}&id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' }),
    listPosts: async (ids, limit) => { ids = ids.filter(uuidOk); if (!ids.length) return []; const rows = await sbFetch(`/rest/v1/posts?select=data&author=in.(${ids.join(',')})&order=at.desc&limit=${limit * 4}`, { method: 'GET' }); return rows.map(r => r.data); },
    getPost: async (author, id) => { if (!uuidOk(author)) return null; const rows = await sbFetch(`/rest/v1/posts?select=data&author=eq.${author}&id=eq.${encodeURIComponent(id)}`, { method: 'GET' }); return rows[0] ? rows[0].data : null; },
    deleteAll: async () => { await sbFetch(`/rest/v1/posts?author=eq.${me()}`, { method: 'DELETE' }); await sbFetch(`/rest/v1/profiles?id=eq.${me()}`, { method: 'DELETE' }); }
  };
}

/* ---------- Barcode scanner + Open Food Facts ----------
   Engines, best first: native BarcodeDetector (Android Chrome) → ZXing WASM ponyfill from jsDelivr (iOS, desktop) →
   our own EAN-13 / EAN-8 / UPC-A decoder below, which needs no download and also works offline.
   Product data: /api/food (Cloudflare function with User-Agent and cache), falling back to Open Food Facts directly.
   Strings are bilingual inline via L(de, en). */

/* ---------- Own EAN decoder ---------- */
const EAN_L = ['3211', '2221', '2122', '1411', '1132', '1231', '1114', '1312', '1213', '3112'].map(s => s.split('').map(Number));
const EAN_G = EAN_L.map(p => p.slice().reverse());
const EAN_PAR = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLG', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
function eanCheckOk(ds) { let s = 0; for (let k = ds.length - 2, w = 3; k >= 0; k--, w = 4 - w) s += ds[k] * w; return (10 - s % 10) % 10 === ds[ds.length - 1]; }

async function loadFeed() {

function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 86400000 + 1) / 7); }
function progressHTML() {
  const ws = S.weights.slice(-20), last = ws[ws.length - 1], first = ws[0];
  let chart = '<div class="cap">Trag dein Gewicht regelmäßig ein, dann erscheint hier dein Verlauf.</div>';
  if (ws.length >= 2) {
    const W = 340, H = 140, kgs = ws.map(w => w.kg), mn = Math.min(...kgs) - 0.5, mx = Math.max(...kgs) + 0.5;
    const pts = ws.map((w, i) => [16 + i * (W - 32) / (ws.length - 1), 12 + (H - 34) * (1 - (w.kg - mn) / (mx - mn))]);
    const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '), lp = pts[pts.length - 1];
    chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gewichtsverlauf"><line x1="16" x2="${W-16}" y1="${H-22}" y2="${H-22}" stroke="var(--line)"/><path d="${path} L${lp[0]} ${H-22} L16 ${H-22}Z" fill="var(--ember)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--ember)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="var(--ember)"/><text x="16" y="${H-6}" font-size="11" fill="var(--ink-muted)">${new Date(first.d).toLocaleDateString(LOC(),{day:'numeric',month:'short'})}</text><text x="${W-16}" y="${H-6}" font-size="11" fill="var(--ink-muted)" text-anchor="end">${new Date(last.d).toLocaleDateString(LOC(),{day:'numeric',month:'short'})}</text></svg>`;
  }
  const weeks = []; for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i * 7); weeks.push(weekKey(d)); }
  const vol = weeks.map(k => S.workouts.filter(w => weekKey(new Date(w.start)) === k).reduce((a, w) => a + volume(w), 0)), vmax = Math.max(1, ...vol);
  const prs = {}; for (const w of S.workouts) for (const e of w.exercises) for (const s of e.sets) if (s.done && s.reps > 0 && s.type !== 'w') { const v = e1rm(s); if (!prs[e.exId] || v > prs[e.exId].v) prs[e.exId] = { v, kg: s.kg, reps: s.reps }; }
  const prList = Object.entries(prs).sort((a, b) => b[1].v - a[1].v).slice(0, 6);
  return `<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="cap">Körpergewicht</div><div class="disp" style="font-size:26px;line-height:30px">${last ? fmt1(last.kg) : '–'} <span class="cap">kg</span></div></div>${ws.length >= 2 ? `<span class="tag">${last.kg - first.kg > 0 ? '+' : ''}${fmt1(last.kg - first.kg)} kg seit ${new Date(first.d).toLocaleDateString(LOC(),{day:'numeric',month:'short'})}</span>` : ''}</div>
      <div style="margin-top:8px">${chart}</div>
      <div class="row" style="margin-top:10px"><span class="unit grow"><input class="input" id="w-in" inputmode="decimal" placeholder="z. B. 77,5" aria-label="Heutiges Gewicht"><span>kg</span></span><button class="btn btn-p" data-act="addweight">Speichern</button></div></div>
    <div class="card"><div class="lbl" style="margin-bottom:10px">Trainingsvolumen pro Woche</div><div class="bars">${vol.map((v, i) => `<div><span class="num">${v ? fmt1(v / 1000) + ' t' : ''}</span><i style="height:${Math.max(2, v / vmax * 80)}px;${i === 5 ? '' : 'opacity:.45'}"></i><span>${i === 5 ? 'Diese' : 'KW ' + isoWeek(new Date(weeks[i]))}</span></div>`).join('')}</div></div>
    <div class="card"><div class="lbl">Persönliche Rekorde</div>${prList.length ? `<ul class="list">${prList.map(([id, p]) => `<li><span style="color:var(--good)">${ic('trophy', 20)}</span><div class="grow"><div style="font-weight:600">${esc(exOf(id).name)}</div><div class="cap">geschätztes Maximum ${fmt1(p.v)} kg</div></div><span class="num" style="font-weight:700">${fmt1(p.kg)} × ${p.reps}</span></li>`).join('')}</ul>` : '<div class="cap" style="margin-top:6px">Nach deinem ersten Training stehen hier deine Bestwerte.</div>'}</div>`;
}

  if (!mp) { const p = mpDraft || (mpDraft = mpPrefs()); return back + `<div class="card soft"><div style="font-weight:700">So soll dein Plan aussehen</div><div class="cap" style="margin-top:4px">Wähle aus, dann erstellt die KI Rezepte, einen Meal-Prep-Plan und eine Einkaufsliste für einen Einkauf.</div></div>${mpErr ? `<div class="banner">${esc(mpErr)}</div>` : ''}<div class="card" id="mpcfg" style="display:flex;flex-direction:column;gap:14px">${mpConfigHTML(p)}</div><button class="btn btn-p btn-block" data-act="mpgen">${ic('spark', 18)} Plan erstellen</button><p class="cap" style="margin:0">Ein Vorschlag, keine medizinische Ernährungsberatung.</p>`; }
  const tabs = `<div class="seg"><button class="${mpTab === 'woche' ? 'on' : ''}" data-mptab="woche">Woche</button><button class="${mpTab === 'prep' ? 'on' : ''}" data-mptab="prep">Meal Prep</button><button class="${mpTab === 'shop' ? 'on' : ''}" data-mptab="shop">Einkauf</button></div>`;
  const pr = mp.prefs, info = `<div class="cap">${mp.days.length} ${mp.days.length === 1 ? 'Tag' : 'Tage'} · ${mp.recipes.length} Rezepte · ${pr.prep === '0' ? 'ohne Meal Prep' : 'Meal Prep ' + pr.prep + '× pro Woche'} · für ${pr.people} ${pr.people === 1 ? 'Person' : 'Personen'}</div>`;
  let body = '';
  if (mpTab === 'woche') body = mp.days.map((d, di) => { const rs = d.meals.map(m => mpRecipe(m.recipe)).filter(Boolean), kc = rs.reduce((a, r) => a + r.kcal, 0), pp = rs.reduce((a, r) => a + r.protein, 0), isT = d.key === dayKey();
    return `<div class="card" style="${isT ? 'border-color:var(--ember)' : ''}"><div class="row" style="justify-content:space-between"><div style="font-weight:800">${esc(d.label)}${isT ? ' <span class="tag ember">Heute</span>' : ''}</div><span class="cap num">${fmt(kc)} kcal · ${fmt(pp)} g P</span></div>
      <ul class="list">${d.meals.map((m, mi) => { const r = mpRecipe(m.recipe); if (!r) return ''; return `<li><button data-recipe="${esc(r.id)}" class="row grow" style="border:0;background:transparent;padding:0;text-align:left;gap:12px;min-width:0"><span style="flex:none;border-radius:10px;overflow:hidden;display:block">${dishSVG(r, 64)}</span><span style="min-width:0"><span class="cap" style="display:block">${SLOTS.find(s => s[0] === m.slot)[1]}${r.mealprep && pr.prep !== '0' ? ' · Meal Prep' : ''}</span><b style="display:block">${esc(r.name)}</b><span class="cap">${fmt(r.kcal)} kcal · ${fmt(r.protein)} g P</span></span></button><button class="iconbtn" style="width:38px;height:38px;${m.eaten ? 'background:var(--good);color:#fff' : ''}" data-mpeat="${di}:${mi}" aria-label="${m.eaten ? 'Eingetragen' : 'Als gegessen eintragen'}">${ic('check', 18)}</button></li>`; }).join('')}</ul></div>`; }).join('');
  if (mpTab === 'prep') body = mp.prep.length ? mp.prep.map((s, si) => `<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><div><div class="cap">Meal-Prep-Session</div><div style="font-weight:800;font-size:18px">${esc(s.day)}</div></div><span class="tag">${ic('timer', 14)} ca. ${s.minutes || '–'} min</span></div>
      <div class="row" style="gap:8px;flex-wrap:wrap">${s.recipes.map(id => { const r = mpRecipe(id); return r ? `<button class="chip" data-recipe="${esc(r.id)}">${esc(r.name)} · ${r.portions}×</button>` : ''; }).join('')}</div>
      ${s.steps.length ? `<ol class="steps">${s.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
      <button class="btn ${s.done ? 'btn-s' : 'btn-p'} btn-block" data-prepdone="${si}">${s.done ? ic('check', 18) + ' Erledigt' : 'Als erledigt markieren'}</button></div>`).join('') + '<p class="cap" style="margin:0">Vorgekochtes in luftdichten Boxen im Kühlschrank lagern und spätestens nach 4 Tagen essen oder einfrieren.</p>'
    : '<div class="card empty">Dieser Plan ist ohne Meal Prep. Unter „Anpassen“ kannst du 1× oder 2× pro Woche wählen.</div>';
  if (mpTab === 'shop') { const groups = {}; mp.shopping.forEach((s, i) => (groups[s.category] = groups[s.category] || []).push([s, i])); const left = mp.shopping.filter(s => !s.done).length;
    body = `<div class="row" style="justify-content:space-between"><span class="cap">${left} von ${mp.shopping.length} offen · ein Einkauf für den ganzen Plan</span>${mp.shopping.some(s => s.done) ? '<button class="btn btn-g" data-act="shopreset">Zurücksetzen</button>' : ''}</div>` + Object.entries(groups).map(([c, items]) => `<div class="card" style="padding-top:8px;padding-bottom:4px"><div class="lbl">${esc(c)}</div>${items.map(([s, i]) => `<div class="sel" data-shop="${i}" style="cursor:pointer"><span class="pick ${s.done ? 'on' : ''}">${ic('check', 14)}</span><div class="grow" style="${s.done ? 'text-decoration:line-through;color:var(--ink-muted)' : ''}">${esc(s.item)}</div><span class="cap">${esc(s.amount)}</span></div>`).join('')}</div>`).join(''); }
  return back + info + tabs + body + `<p class="cap" style="margin:0">Erstellt ${ago(mp.at)}. Ein Vorschlag, keine medizinische Ernährungsberatung. Die Bilder sind Illustrationen.</p>`;
}
let mpDraft = null;
function mpConfigSheet() {
  const p = mpPrefs();
  const draw = sh => { sh.innerHTML = `<div class="grab"></div><div class="row" style="justify-content:space-between"><h2 class="disp">Plan anpassen</h2><button class="iconbtn" data-close-sheet aria-label="Schließen">${ic('x')}</button></div>${mpConfigHTML(p)}<button class="btn btn-p btn-block" data-mpgo>${ic('spark', 18)} Neuen Plan erstellen</button><p class="cap" style="margin:0">Der aktuelle Plan wird ersetzt.</p>`; };
  openSheet('', sh => { draw(sh); bindMpConfig(sh, p, () => draw(sh)); sh.addEventListener('click', ev => { if (ev.target.closest('[data-mpgo]')) { const di = sh.querySelector('#mp-dis'); p.dislikes = di ? di.value.trim() : ''; closeSheet(); runMealPlan(p); } }); });
}
async function runMealPlan(p) {
  S.mealPrefs = { ...p }; save(); mpBusy = true; mpErr = ''; view = 'mealplan'; render();
  try { await generateMealPlan(p); mpTab = 'woche'; mpDraft = null; } catch (e) { mpErr = errText(e); if (S.mealPlan && S.mealPlan.v === 2) toast(mpErr); }
  mpBusy = false; render();
}
function recipeSheet(id) {
  const r = mpRecipe(id); if (!r) return;
  openSheet(`<div style="border-radius:16px;overflow:hidden">${dishSVG(r, 600).replace(/width="600" height="\d+"/, 'width="100%" style="display:block"')}</div>
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0"><div class="cap">${SLOTS.find(s => s[0] === r.slot)[1]} · Illustration</div><h2 class="disp">${esc(r.name)}</h2></div><button class="iconbtn" data-close-sheet aria-label="Schließen">${ic('x')}</button></div>
    <div class="chips"><span class="tag">${ic('timer', 14)} ${r.minutes} min</span><span class="tag">${r.portions} ${r.portions === 1 ? 'Portion' : 'Portionen'}</span>${r.mealprep ? '<span class="tag ember">Meal-Prep-geeignet</span>' : ''}${r.storage ? `<span class="tag">${esc(r.storage)}</span>` : ''}</div>
    <div class="card"><div class="row" style="justify-content:space-between"><div class="lbl">Pro Portion</div><span class="disp num" style="font-size:20px">${fmt(r.kcal)} kcal</span></div><div class="cap" style="margin-top:6px"><span class="dot p-bg"></span> ${fmt(r.protein)} g Protein · <span class="dot c-bg"></span> ${fmt(r.carbs)} g KH · <span class="dot f-bg"></span> ${fmt(r.fat)} g Fett${r.fiber !== undefined ? ` · ${fmt1(r.fiber)} g Ballaststoffe` : ''}</div></div>
    <div class="card"><div class="lbl" style="margin-bottom:6px">Zutaten für ${r.portions} ${r.portions === 1 ? 'Portion' : 'Portionen'}</div><ul class="steps">${r.ingredients.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="card"><div class="lbl" style="margin-bottom:6px">Zubereitung</div><ol class="steps">${r.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>
    <button class="btn btn-p btn-block" data-reat>${ic('check', 18)} 1 Portion als gegessen eintragen</button>`, sh => sh.addEventListener('click', ev => {
      if (!ev.target.closest('[data-reat]')) return;
      today().meals[r.slot].push({ id: uid(), name: r.name, grams: 0, kcal: r0(r.kcal), p: r1(r.protein), c: r1(r.carbs), f: r1(r.fat), ...(r.fiber !== undefined ? { fib: r1(r.fiber) } : {}), src: 'plan' });
      const d = S.mealPlan.days.find(x => x.key === dayKey()); if (d) { const m = d.meals.find(x => x.recipe === r.id && !x.eaten); if (m) m.eaten = true; }
      save(); closeSheet(); render(); toast(`${r.name} eingetragen`);
    }));
}

/* ---------- Paywall (demo) ---------- */
function paywall(reason) {
  openSheet(`${reason ? `<div class="banner">${ic('lock', 18)}<div>${esc(reason)}</div></div>` : ''}<span class="tag ember" style="align-self:flex-start">Repwerk Pro</span><h2 class="disp" style="font-size:28px;line-height:32px">Dein Plan passt sich jede Woche an.</h2>
    <ul class="list">${['Keine Werbung','30 KI-Scans pro Tag statt 3','KI-Ernährungsplan mit Rezepten und Einkaufsliste','AI Coach mit 50 Nachrichten pro Tag','Trainingsplan, der mit deiner Leistung wächst','Wochen- und Monatsberichte'].map(x => `<li><span style="color:var(--good)">${ic('check', 20)}</span>${x}</li>`).join('')}</ul>
    <div class="card row" style="border-color:var(--ember);background:var(--ember-soft)"><div class="grow"><div style="font-weight:700">Jährlich</div><div class="cap">59,99 € pro Jahr · entspricht 5,00 € im Monat</div></div><span class="tag ember">−44 %</span></div>
    <div class="card"><div style="font-weight:700">Monatlich</div><div class="cap">8,99 € pro Monat</div></div>
    <button class="btn btn-p btn-block" data-pro>Pro in der Demo freischalten</button>
    <p class="cap" style="margin:0;text-align:center">Prototyp: Es wird nichts bezahlt. In der App läuft der Kauf über App Store bzw. Google Play mit 7 Tagen gratis, jederzeit kündbar.</p>
    <button class="btn btn-g btn-block" data-close-sheet style="color:var(--ink-muted)">Mit Free weitermachen</button>`, sh => sh.addEventListener('click', ev => { if (ev.target.closest('[data-pro]')) { S.pro = true; save(); closeSheet(); render(); toast('Pro ist in der Demo aktiv'); } }));
}

/* ---------- Coach ---------- */
function coachContext() {
  const t = dayTotals(today()), g = dayTargets(), p = S.profile, pl = plan(), ck = lastCheckin(), tr = weightTrend(S);
  const last = S.workouts.slice(-3).map(w => ({ einheit: w.name, datum: dayKey(new Date(w.start)), saetze: doneCount(w), volumen_kg: r0(volume(w)), uebungen: w.exercises.map(e => `${exOf(e.exId).name}: ${e.sets.map(s => s.kg + 'x' + s.reps + (s.type !== 'n' ? '(' + TYPES[s.type] + ')' : '')).join(', ')}`) }));
  return { ziel: GOALS[p.goal], erfahrung: EXP[p.experience], koerper: { alter: p.age, groesse_cm: p.height, gewicht_kg: p.weight, wunschgewicht_kg: p.targetWeight || null }, ernaehrung: DIETS[p.diet], unvertraeglichkeiten: (p.allergies || []).map(a => ALLERGENS[a]), trainingstage_pro_woche: p.days, minuten_pro_training: p.duration, ort: p.location === 'home' ? 'zu Hause' : 'Studio', plan: pl.name, naechste_einheit: nextRoutine().name, heute: { kcal: r0(t.kcal), protein: r0(t.p), kh: r0(t.c), fett: r0(t.f), wasser_ml: today().water || 0 }, tagesziel: { kcal: g.kcal, protein: g.p, kh: g.c, fett: g.f, wasser_ml: g.water }, tagestyp: g.type === 'rest' ? 'Ruhetag' : 'Trainingstag', wochenschnitt_kcal: baseTargets().kcal, gewichtstrend_kg_pro_woche: tr.rate !== undefined ? r1(tr.rate) : null, letzter_checkin: ck, letzte_trainings: last, gewichtsverlauf: S.weights.slice(-6) };
}
function coach() {
  const wk = weekKey(); if (S.coach.week !== wk) S.coach = { week: wk, count: 0 };
  const left = () => S.pro ? 'Pro' : `${Math.max(0, lim().coach - S.coach.count)} von ${lim().coach} Fragen diese Woche frei`;
  const msgs = () => S.chat.slice(-12).map(m => `<div translate="no" style="align-self:${m.role === 'user' ? 'flex-end' : 'flex-start'};max-width:86%;padding:10px 14px;border-radius:18px;${m.role === 'user' ? 'background:var(--ember);color:var(--on-ember);border-bottom-right-radius:6px' : 'background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px'};white-space:pre-wrap">${esc(m.content)}</div>`).join('');
  const sugg = ['Was soll ich heute essen, um mein Proteinziel zu schaffen?','Wie entwickle ich mich im Training?','Wie sollte mein nächster Trainingstag aussehen?'];
  openSheet(`<div class="row" style="justify-content:space-between"><div><div class="cap" id="cleft">${left()}</div><h2 class="disp">AI Coach</h2></div><button class="iconbtn" data-close-sheet aria-label="Schließen">${ic('x')}</button></div>
    ${sampleFn ? '' : `<div class="banner">${aiOffText()}</div>`}
    <div id="cm" style="display:flex;flex-direction:column;gap:10px;min-height:120px">${S.chat.length ? msgs() : `<p class="muted" style="margin:0">Der Coach kennt dein Ziel, deine Makros, deine Ernährung, deinen Plan und deine letzten Trainings. Frag zum Beispiel:</p><div style="display:flex;flex-direction:column;gap:8px">${sugg.map(s => `<button class="chip" style="text-align:left;white-space:normal" data-sug="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}</div>
    <div class="row"><input class="input grow" id="ci" placeholder="Frag deinen Coach" aria-label="Frage an den Coach" ${sampleFn ? '' : 'disabled'}><button class="btn btn-p" data-send ${sampleFn ? '' : 'disabled'} aria-label="Senden">${ic('chat', 20)}</button></div>`, sh => {
      const send = async text => {
        if (!text || !sampleFn) return;
        if (!S.pro && S.coach.count >= lim().coach) { paywall('Du hast diese Woche ' + lim().coach + ' Coach-Fragen genutzt.'); return; }
        S.chat.push({ role: 'user', content: text.slice(0, 600) }); S.coach.count++; save();
        const cm = sh.querySelector('#cm'); cm.innerHTML = msgs() + '<div id="cr" style="align-self:flex-start;max-width:86%;padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap" class="muted">Denkt nach …</div>';
        const rules = `Du bist der AI Coach der Fitness-App Repwerk Fitness. ${isEN() ? 'Antworte auf Englisch, locker und direkt,' : 'Antworte auf Deutsch, per du,'} kurz (höchstens 120 Wörter), konkret mit Zahlen aus den Daten. Ton: direkter, ermutigender Trainer, keine Übertreibung, keine Emojis. Beachte Ernährungsform und Unverträglichkeiten. Keine medizinischen Diagnosen, keine extremen Diäten; bei Schmerzen, Krankheit oder Essstörungs-Signalen freundlich auf Ärztin oder Arzt verweisen. Daten der Person (JSON): ${JSON.stringify(coachContext())}`;
        const turns = [{ role: 'user', content: rules }, ...S.chat.slice(-8)]; if (turns[1] && turns[1].role === 'assistant') turns.splice(1, 1);
        try { const { text: answer } = await sampleFn(turns, { cache: false, modelTier: 'quick', onText: ({ text }) => { const cr = sh.querySelector('#cr'); if (cr) { cr.classList.remove('muted'); cr.textContent = text; } } }); S.chat.push({ role: 'assistant', content: answer }); }
        catch (e) { S.chat.push({ role: 'assistant', content: e && e.text ? e.text : errText(e) }); }
        save(); cm.innerHTML = msgs(); cm.lastElementChild && cm.lastElementChild.scrollIntoView({ block: 'nearest' }); const c = sh.querySelector('#cleft'); if (c) c.textContent = left();
      };
      sh.addEventListener('click', ev => { const s = ev.target.closest('[data-sug]'); if (s) { send(s.dataset.sug); return; } if (ev.target.closest('[data-send]')) { const i = sh.querySelector('#ci'); const v = i.value.trim(); i.value = ''; send(v); } });
      sh.querySelector('#ci').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); const v = ev.target.value.trim(); ev.target.value = ''; send(v); } });
    });
}

/* ---------- Boot ---------- */
S = migrate(loadLocal());
applyDesign(); applyLang();
render();
if (IN_CLAUDE) { connectDb(); connectSample(); } else { connectApi(); registerSW(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
setInterval(() => { if (!S || !S.active) return; const el = $('#w-dur'); if (el) el.textContent = clock(elapsed(S.active)); const b = $('#ab-dur'); if (b) b.textContent = clock(elapsed(S.active)); }, 1000);

</script>
</body>
